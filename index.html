                          <div>

                            <div className="flex items-center justify-between mb-5">

                              <span className="text-xs text-brand-muted">

                              {project.tools.map(

                                  <span
                                    key={tool}
                                    className="text-[10px] uppercase tracking-widest text-brand-muted"

                            <div className="mt-8 flex items-center gap-3 text-xs uppercase tracking-widest">

                    <i
                      data-lucide="arrow-right"
                      className="w-4 h-4"

                  </button>

                </section>

              </div>

            )}


            {/* =================================================
                EXPERIENCE
            ================================================= */}

            {currentRoute === "/exp" && (

              <div className="reveal">

                <section className="pb-24">

                  <div className="grid lg:grid-cols-[0.35fr_1fr] gap-12">

                    <span className="text-xs uppercase tracking-[0.25em] text-brand-muted">
                      01 / Career
                    </span>


                    <div>

                      <h1 className="font-serif text-5xl sm:text-7xl leading-[0.9] tracking-tight">

                      </h1>

                </section>

                            </div>

                          </div>

                              <a

                                rel="noopener noreferrer"

                                Open Drive

                                  className="w-4 h-4"

                              </a>

                                  GitHub Repository
                                  <i
                                    data-lucide="arrow-up-right"
                                    className="w-4 h-4"
                                  ></i>
                                </a>

                          </div>

                        </div>

                          <div className="mt-16 pt-10 border-t border-brand-line">

                            <div className="grid sm:grid-cols-2 gap-8">

                              {activeModalProject.proofImages.map(
                                (image, index) => (

                                  <figure
                                    key={index}

                                    <div className="aspect-[16/10] overflow-hidden">

                                      <img
                                        src={image.url}
                                        alt={image.caption}
                                        className="w-full h-full object-cover"
                                      />

                                    </div>

                                    <figcaption className="mt-3 text-[10px] uppercase tracking-widest text-brand-muted">
                                      {image.caption}
                                    </figcaption>

                                  </figure>

                                )

                            </div>

                          </div>

                    </div>

                  </div>

                )}

              </div>

            )}

          </main>


          <Footer />

        </div>

      );

    }


    /* =========================================================

    ReactDOM
      .createRoot(
        document.getElementById("root")

      .render(<App />);

  </script>
