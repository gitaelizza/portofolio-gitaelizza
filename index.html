              <div>
                <p className="text-xs uppercase tracking-[.25em] text-brand-pinkDark">Hello, I'm Sangwon</p>
                <h2 className="font-serif text-4xl sm:text-5xl leading-tight mt-3">I enjoy turning information into something people can <span className="italic text-brand-sageDark">understand and use.</span></h2>
                <p className="text-sm leading-7 text-brand-muted max-w-2xl mt-7">{PORTFOLIO_DATA.fullAbout}</p>
                <div className="mt-8 flex flex-wrap gap-3">
                  {["Data Analysis","Business Intelligence","Data Visualization","Technology"].map(item => <span key={item} className="px-4 py-2 rounded-full bg-brand-sageLight text-brand-sageDark text-[10px] uppercase tracking-widest">{item}</span>)}
                </div>
              </div>
            </div>
          </section>

          <section className="border-t border-brand-line py-12">
            <div className="grid md:grid-cols-[.3fr_1fr] gap-8">
              <span className="text-xs uppercase tracking-[.25em] text-brand-muted">Education</span>
              <div className="pastel-card rounded-2xl p-7">
                <div className="flex flex-col sm:flex-row sm:justify-between gap-3">
                  <div>
                    <p className="text-[10px] uppercase tracking-[.2em] text-brand-pinkDark">Bachelor's Degree</p>
                    <h3 className="font-serif text-2xl mt-2">{PORTFOLIO_DATA.education.degree}</h3>
                    <p className="text-sm text-brand-sageDark mt-1">{PORTFOLIO_DATA.education.university}</p>
                  </div>
                  <div className="sm:text-right text-xs text-brand-muted">
                    <p>{PORTFOLIO_DATA.education.period}</p><p className="mt-1">GPA {PORTFOLIO_DATA.education.gpa}</p>
                  </div>
                </div>
                <div className="mt-7 pt-5 border-t border-brand-line">
                  <p className="text-[10px] uppercase tracking-[.2em] text-brand-muted">Thesis</p>
                  <p className="font-serif text-xl mt-2 leading-snug">{PORTFOLIO_DATA.education.thesisTitle}</p>
                </div>
              </div>
            </div>
          </section>
        </div>
      );

      const ExperiencePage = () => (
        <div className="reveal">
          <PageIntro number="02 / Career" title="Experience" description="Professional experience and selected organizational involvement." />

          <section className="border-t border-brand-line py-12">
            <div>
              <span className="inline-block text-xs uppercase tracking-[.25em] text-brand-muted mb-6">Work</span>
              <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {PORTFOLIO_DATA.workExperience.map((exp,index) => (
                  <article key={exp.id} className="experience-card rounded-2xl overflow-hidden">
                    {exp.photos?.length > 0 && (
                      <div className={`grid ${exp.photos.length > 1 ? "grid-cols-2" : "grid-cols-1"} gap-1 p-1 bg-brand-pinkLight`}>
                        {exp.photos.slice(0,2).map((photo,i) => (
                          <div key={i} className="experience-photo overflow-hidden rounded-xl">
                            <img src={photo.url} alt={photo.caption || exp.role} className="w-full h-full object-cover" />
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="p-5">
                      <div className="flex justify-between gap-3">
                        <span className="text-[10px] uppercase tracking-[.2em] text-brand-pinkDark">0{index+1}</span>
                        <span className="text-[10px] text-brand-muted text-right">{exp.period}</span>
                      </div>
                      <h2 className="font-serif text-xl leading-tight mt-4">{exp.role}</h2>
                      <p className="text-sm text-brand-sageDark mt-1">{exp.company}</p>
                      <p className="text-[11px] text-brand-muted mt-1">{exp.location}</p>
                      <p className="mt-3 text-sm leading-6 text-brand-muted">{exp.summary}</p>
                      <div className="mt-3 space-y-1.5">
                        {exp.highlights.map((h,i)=><p key={i} className="text-xs leading-5 flex gap-2"><span className="text-brand-pinkDark">·</span>{h}</p>)}
                      </div>
                    </div>
                  </article>
                ))}
              </div>
            </div>
          </section>

          <section className="border-t border-brand-line py-12">
            <div>
              <span className="inline-block text-xs uppercase tracking-[.25em] text-brand-muted mb-6">Organizational Experience</span>
              <div className="space-y-3">
                {PORTFOLIO_DATA.orgExperience.map((org,index) => (
                  <article key={org.id} className="org-card rounded-2xl p-5 md:p-6">
                    <div className="grid md:grid-cols-[auto_1fr_auto] gap-4 md:gap-7 items-start">
                      <span className="text-[10px] uppercase tracking-[.2em] text-brand-pinkDark">0{index+1}</span>
                      <div>
                        <h3 className="text-lg font-semibold leading-tight">{org.role}</h3>
                        <p className="text-sm text-brand-sageDark mt-1">{org.organization}</p>
                        <p className="text-sm text-brand-muted leading-6 mt-2 max-w-3xl">{org.description}</p>
                      </div>
                      <span className="text-xs text-brand-muted md:text-right whitespace-nowrap">{org.period}</span>
                    </div>
                  </article>
                ))}
              </div>
            </div>
          </section>
        </div>
      );

      function ProjectCard({project,index}) {
        return (
          <article className="project-card pastel-card rounded-2xl overflow-hidden group">
            <a href={project.driveDocUrl} target="_blank" rel="noopener noreferrer" className="block image-hover overflow-hidden aspect-[4/3]">
              <img src={project.coverImage} alt={project.title} className="w-full h-full object-cover"/>
            </a>
            <div className="p-5">
              <div className="flex items-center justify-between gap-3">
                <p className="text-[10px] uppercase tracking-[.2em] text-brand-pinkDark">{project.category}</p>
                {index !== undefined && <span className="text-[10px] text-brand-muted">0{index+1}</span>}
              </div>
              <h2 className="font-serif text-2xl leading-tight mt-2 group-hover:text-brand-pinkDark transition">{project.title}</h2>
              <p className="text-sm leading-6 text-brand-muted mt-2">{project.shortDesc}</p>
              <div className="flex flex-wrap gap-x-3 gap-y-1 mt-3">
                {project.tools.map(tool=><span key={tool} className="text-[9px] uppercase tracking-widest text-brand-sageDark">{tool}</span>)}
              </div>
              <a href={project.driveDocUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 mt-5 text-[10px] uppercase tracking-[.18em] border-b border-brand-text pb-1 hover:text-brand-pinkDark hover:border-brand-pinkDark">
                Details <i data-lucide="arrow-up-right" className="w-3.5 h-3.5"></i>
              </a>
            </div>
          </article>
        );
      }

      const ProjectPage = () => (
        <div className="reveal">
          <PageIntro number="03 / Selected Work" title="Projects" description="Selected work in data analysis, visualization, business intelligence, and machine learning." />
          <section className="border-t border-brand-line">
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {PORTFOLIO_DATA.projects.map((project,index)=><ProjectCard key={project.id} project={project} index={index} />)}
            </div>
          </section>
        </div>
      );

      let pageContent;
      if (currentRoute === "/home") pageContent=<HomePage />;
      else if (currentRoute === "/aboutme") pageContent=<AboutMePage />;
      else if (currentRoute === "/exp") pageContent=<ExperiencePage />;
      else if (currentRoute === "/project") pageContent=<ProjectPage />;
      else pageContent=<HomePage />;

      return (
        <div className="min-h-screen bg-brand-bg text-brand-text">
          <Navbar />
          <main className="max-w-8xl mx-auto px-6 sm:px-10 lg:px-16 pt-10 md:pt-12">{pageContent}</main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
