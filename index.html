                          <img src={proj.coverImage} alt={proj.title} className="w-full h-40 object-cover" />
                          <div className="p-5">
                            <span className="text-[10px] font-bold tracking-widest uppercase bg-brand-sageLight text-brand-sageDark px-2.5 py-1 rounded-full">
                              {proj.category}
                            </span>
                            <h4 className="text-base font-bold text-brand-text mt-3">{proj.title}</h4>
                            <p className="text-xs text-brand-muted mt-2 line-clamp-2">{proj.shortDesc}</p>
                          </div>
                        </div>

                        <div className="p-5 pt-0 flex justify-end">
                          <button
                            onClick={() => navigateTo('/project')}
                            className="text-xs font-bold text-brand-text hover:text-brand-sageDark flex items-center gap-1"
                          >
                            <span>View Project</span>
                            <i data-lucide="chevron-right" className="w-4 h-4"></i>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

              </div>
            )}

            {/* ========================================== */}
            {/* ROUTE 3: /exp PAGE (REVISED TIMELINE)       */}
            {/* ========================================== */}
            {currentRoute === '/exp' && (
              <div className="space-y-12">
                <div>
                  <span className="text-xs font-bold uppercase tracking-widest text-brand-sageDark bg-brand-sageLight px-3 py-1.5 rounded-full inline-block mb-3">
                    Career Roadmap
                  </span>
                  <h2 className="font-serif text-3xl sm:text-4xl md:text-5xl font-bold text-brand-text">Experience Timeline</h2>
                  <p className="text-brand-muted text-sm sm:text-base mt-2 max-w-2xl">
                    An interactive vertical timeline showcasing professional milestones, key responsibilities, and event photos.
                  </p>
                </div>

                {/* Timeline Layout */}
                <div className="relative border-l-2 border-brand-sageSoft/60 ml-4 md:ml-8 pl-6 md:pl-10 space-y-12">
                  
                  {/* Combined Work & Org Timeline Items */}
                  {[...PORTFOLIO_DATA.workExperience, ...PORTFOLIO_DATA.orgExperience].map((exp, idx) => (
                    <div key={exp.id} className="relative group">
                      
                      {/* Glowing Node Dot */}
                      <div className="absolute -left-[31px] md:-left-[47px] top-1.5 w-5 h-5 rounded-full bg-brand-bg border-4 border-brand-sageDark group-hover:scale-125 transition-transform"></div>

                      <div className="bg-white rounded-3xl p-6 sm:p-8 border border-brand-border shadow-sm hover:shadow-md transition-all">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                          <div>
                            {/* Position/Jabatan Dulu, Nama Perusahaan di bawahnya */}
                            <h3 className="text-xl font-bold text-brand-text">{exp.role}</h3>
                            <p className="text-xs font-semibold text-brand-pinkDark mt-0.5">{exp.company}</p>
                          </div>
                          <span className="text-xs font-medium text-brand-sageDark bg-brand-sageLight px-3 py-1.5 rounded-full self-start sm:self-auto">
                            {exp.period}
                          </span>
                        </div>

                        <p className="text-xs sm:text-sm text-brand-muted mb-6 leading-relaxed">{exp.summary}</p>

                        {/* Bullet points */}
                        <div className="space-y-2 mb-6 bg-brand-bg/50 p-4 rounded-2xl border border-brand-border/60">
                          <h4 className="text-[10px] font-bold uppercase tracking-wider text-brand-muted mb-2">Key Highlights</h4>
                          {exp.highlights.map((h, i) => (
                            <div key={i} className="text-xs text-brand-text flex items-start gap-2">
                              <span className="text-brand-sageDark font-bold mt-0.5">•</span>
                              <span>{h}</span>
                            </div>
                          ))}
                        </div>

                        {/* Photo Documentation */}
                        {exp.photos && (
                          <div>
                            <h4 className="text-[10px] font-bold uppercase tracking-wider text-brand-muted mb-3 flex items-center gap-1.5">
                              <i data-lucide="camera" className="w-3.5 h-3.5 text-brand-pinkDark"></i>
                              <span>Activity Documentation</span>
                            </h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              {exp.photos.map((photo, pIdx) => (
                                <div key={pIdx} className="rounded-2xl overflow-hidden border border-brand-border bg-brand-bg">
                                  <img src={photo.url} alt={photo.caption} className="w-full h-40 object-cover" />
                                  <div className="p-2.5 text-[11px] font-medium text-brand-text bg-white border-t border-brand-border">
                                    {photo.caption}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>

                    </div>
                  ))}

                </div>
              </div>
            )}

            {/* ========================================== */}
            {/* ROUTE 4: /project PAGE (3-COLUMN & MODAL)  */}
            {/* ========================================== */}
            {currentRoute === '/project' && (
              <div className="space-y-12">
                <div>
                  <span className="text-xs font-bold uppercase tracking-widest text-brand-pinkDark bg-brand-pinkLight px-3 py-1.5 rounded-full inline-block mb-3">
                    Portfolio Archive
                  </span>
                  <h2 className="font-serif text-3xl sm:text-4xl md:text-5xl font-bold text-brand-text">Projects & Proof of Work</h2>
                  <p className="text-brand-muted text-sm sm:text-base mt-2 max-w-2xl">
                    Structured 3-column grid layout. Click on any project card to view full documentation in a clean modal window.
                  </p>
                </div>

                {/* REVISED 2: 3-Column Grid Layout */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {PORTFOLIO_DATA.projects.map((proj) => (
                    <div key={proj.id} className="bg-white rounded-3xl border border-brand-border overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                      
                      {/* Initial Image Display */}
                      <div>
                        <div className="relative h-48 w-full overflow-hidden bg-brand-bg">
                          <img 
                            src={proj.coverImage} 
                            alt={proj.title} 
                            className="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
                          />
                          <div className="absolute top-3 left-3">
                            <span className="text-[10px] font-bold tracking-widest uppercase bg-white/90 backdrop-blur-md text-brand-sageDark px-2.5 py-1 rounded-full border border-brand-border">
                              {proj.category}
                            </span>
                          </div>
                        </div>

                        <div className="p-5">
                          <h3 className="font-serif text-lg font-bold text-brand-text leading-snug">{proj.title}</h3>
                          <p className="text-xs text-brand-muted mt-2 line-clamp-2">{proj.shortDesc}</p>

                          <div className="flex flex-wrap gap-1 mt-4">
                            {proj.tools.map((t, i) => (
                              <span key={i} className="text-[10px] font-medium bg-brand-bg px-2 py-0.5 rounded text-brand-muted border border-brand-border">
                                {t}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      {/* Card Actions */}
                      <div className="p-5 pt-0">
                        <div className="flex items-center justify-between border-t border-brand-border/60 pt-4">
                          <a
                            href={proj.driveDocUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-1 text-[11px] font-bold text-brand-pinkDark hover:text-brand-text transition-colors"
                          >
                            <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                            <span>DRIVE</span>
                          </a>

                          <button
                            onClick={() => setActiveModalProject(proj)}
                            className="inline-flex items-center gap-1 bg-brand-sageDark text-white px-3.5 py-2 rounded-full text-[11px] font-bold tracking-wider hover:bg-brand-text transition-all"
                          >
                            <span>DETAILS</span>
                            <i data-lucide="arrow-up-right" className="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>

                    </div>
                  ))}
                </div>

                {/* REVISED 2: Popup Modal for Project Details (Prevents dragging other projects) */}
                {activeModalProject && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop animate-fadeIn">
                    <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-brand-border shadow-2xl p-6 sm:p-8 space-y-6 relative">
                      
                      {/* Close Button */}
                      <button
                        onClick={() => setActiveModalProject(null)}
                        className="absolute top-6 right-6 p-2 rounded-full bg-brand-bg hover:bg-brand-pinkLight text-brand-text transition-colors"
                      >
                        <i data-lucide="x" className="w-5 h-5"></i>
                      </button>

                      <div>
                        <span className="text-[10px] font-bold tracking-widest uppercase bg-brand-sageLight text-brand-sageDark px-3 py-1 rounded-full">
                          {activeModalProject.category}
                        </span>
                        <h3 className="font-serif text-2xl font-bold text-brand-text mt-3">{activeModalProject.title}</h3>
                      </div>

                      <div className="space-y-4">
                        <div>
                          <h4 className="text-[10px] font-bold uppercase tracking-wider text-brand-muted mb-2">Project Overview</h4>
                          <p className="text-xs sm:text-sm text-brand-text leading-relaxed bg-brand-bg p-4 rounded-2xl border border-brand-border">
                            {activeModalProject.fullDesc}
                          </p>
                        </div>

                        <div>
                          <h4 className="text-[10px] font-bold uppercase tracking-wider text-brand-muted mb-2">Business Outcomes</h4>
                          <div className="p-3.5 rounded-2xl bg-brand-sageLight/60 border border-brand-sageMain/30 text-xs font-semibold text-brand-sageDark">
                            {activeModalProject.outcomes}
                          </div>
                        </div>

                        {/* Proof Visuals */}
                        {activeModalProject.proofImages && (
                          <div>
                            <h4 className="text-[10px] font-bold uppercase tracking-wider text-brand-muted mb-3">UI & Data Proofs</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              {activeModalProject.proofImages.map((img, idx) => (
                                <div key={idx} className="rounded-2xl overflow-hidden border border-brand-border">
                                  <img src={img.url} alt={img.caption} className="w-full h-36 object-cover" />
                                  <div className="p-2 bg-brand-bg text-[10px] font-medium text-brand-text border-t border-brand-border">
                                    {img.caption}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="pt-4 border-t border-brand-border flex flex-wrap gap-3">
                        <a
                          href={activeModalProject.driveDocUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="inline-flex items-center gap-2 bg-brand-pinkLight text-brand-pinkDark px-5 py-2.5 rounded-full text-xs font-bold"
                        >
                          <i data-lucide="file-text" className="w-4 h-4"></i>
                          <span>OPEN DRIVE DOCUMENTATION</span>
                        </a>
                        {activeModalProject.githubUrl && (
                          <a
                            href={activeModalProject.githubUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="inline-flex items-center gap-2 bg-brand-bg text-brand-text border border-brand-border px-5 py-2.5 rounded-full text-xs font-bold"
                          >
                            <i data-lucide="github" className="w-4 h-4"></i>
                            <span>GITHUB REPO</span>
                          </a>
                        )}
                      </div>

                    </div>
                  </div>
                )}

              </div>
            )}

          </main>

          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
