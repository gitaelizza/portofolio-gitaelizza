                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">

                                          src={img.url} 
                                          alt={img.caption} 
                                          className="w-full h-56 object-cover hover:scale-105 transition-transform duration-500"
                                        />
                                        <div className="p-3 bg-white text-xs font-semibold text-brand-text border-t border-brand-border">
                                          {img.caption}
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              )}

                              {/* Project External Links */}
                              <div className="flex flex-wrap items-center gap-4 pt-2">

                                  <a
                                    href={proj.githubUrl}

                                    rel="noopener noreferrer"
                                    className="inline-flex items-center gap-2 text-xs font-bold tracking-wider text-brand-text hover:text-brand-sageDark"
                                  >
                                    <i data-lucide="github" className="w-4 h-4"></i>
                                    <span>VIEW GITHUB REPO</span>
                                  </a>

                                {proj.dashboardUrl && (
                                  <a
                                    href={proj.dashboardUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center gap-2 text-xs font-bold tracking-wider text-brand-pinkDark hover:text-brand-text"
                                  >
                                    <i data-lucide="external-link" className="w-4 h-4"></i>
                                    <span>LIVE DASHBOARD</span>
                                  </a>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </main>

          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
