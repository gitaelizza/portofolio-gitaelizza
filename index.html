                  data-lucide="arrow-right"
                  className="w-4 h-4"
                ></i>

              </button>

            </div>


            <div>

              {PORTFOLIO_DATA.workExperience.map(
                (exp, index) => (

                  <div
                    key={exp.id}
                    className="group border-t border-brand-line py-6 grid md:grid-cols-[0.12fr_1fr_0.25fr] gap-4"
                  >

                    <span className="text-xs text-brand-muted">
                      0{index + 1}
                    </span>


                    <div>

                      <h3 className="text-lg font-semibold group-hover:text-brand-pinkDark transition">
                        {exp.role}
                      </h3>

                      <p className="text-sm text-brand-sageDark mt-0.5">
                        {exp.company}
                      </p>

                      <p className="text-sm text-brand-muted mt-2 leading-6 max-w-xl">
                        {exp.summary}
                      </p>

                    </div>


                    <div className="md:text-right text-xs text-brand-muted">
                      {exp.period}
                    </div>

                  </div>

                )
              )}

            </div>


            <button
              onClick={() => navigateTo("/exp")}
              className="sm:hidden mt-6 flex items-center gap-2 text-xs uppercase tracking-widest"
            >
              View all experience

              <i
                data-lucide="arrow-right"
                className="w-4 h-4"
              ></i>

            </button>

          </section>


          {/* PROJECT PREVIEW */}

          <section className="py-20 border-t border-brand-line">

            <div className="flex justify-between items-end mb-8">

              <div>

                <span className="text-xs uppercase tracking-[0.25em] text-brand-muted">
                  03 / Projects
                </span>

                <h2 className="font-serif text-4xl sm:text-5xl mt-2">
                  Selected work
                </h2>

              </div>


              <button
                onClick={() => navigateTo("/project")}
                className="hidden sm:flex items-center gap-2 text-xs uppercase tracking-widest"
              >
                All projects

                <i
                  data-lucide="arrow-right"
                  className="w-4 h-4"
                ></i>

              </button>

            </div>


            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-10">

              {PORTFOLIO_DATA.projects
                .slice(0, 3)
                .map((project) => (

                  <article
                    key={project.id}
                    className="group"
                  >

                    <div className="image-hover overflow-hidden aspect-[4/3] mb-4">

                      <img
                        src={project.coverImage}
                        alt={project.title}
                        className="w-full h-full object-cover"
                      />

                    </div>


                    <p className="text-[10px] uppercase tracking-[0.2em] text-brand-pinkDark">
                      {project.category}
                    </p>


                    <h3 className="font-serif text-2xl mt-1 group-hover:text-brand-pinkDark transition">
                      {project.title}
                    </h3>


                    <p className="text-sm text-brand-muted leading-6 mt-2">
                      {project.shortDesc}
                    </p>


                    <div className="mt-3 flex flex-wrap gap-x-3 gap-y-1">

                      {project.tools.map(
                        (tool) => (

                          <span
                            key={tool}
                            className="text-[9px] uppercase tracking-widest text-brand-muted"
                          >
                            {tool}
                          </span>

                        )
                      )}

                    </div>


                    <a
                      href={project.driveDocUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-2 mt-5 text-[10px] uppercase tracking-widest border-b border-brand-text pb-1 hover:text-brand-pinkDark hover:border-brand-pinkDark transition"
                    >
                      Details

                      <i
                        data-lucide="arrow-up-right"
                        className="w-3.5 h-3.5"
                      ></i>

                    </a>

                  </article>

                )
              )}

            </div>


            <button
              onClick={() => navigateTo("/project")}
              className="sm:hidden mt-10 flex items-center gap-2 text-xs uppercase tracking-widest"
            >
              View all projects

              <i
                data-lucide="arrow-right"
                className="w-4 h-4"
              ></i>

            </button>

          </section>

        </div>

      );


      /* =========================================================
         EXPERIENCE PAGE
      ========================================================= */

      const ExperiencePage = () => (

        <div className="reveal">

          <section className="pb-16">

            <div className="grid lg:grid-cols-[0.3fr_1fr] gap-8">

              <span className="text-xs uppercase tracking-[0.25em] text-brand-muted">
                01 / Career
              </span>


              <div>

                <h1 className="font-serif text-5xl sm:text-7xl leading-[0.9]">
                  Experience
                </h1>

                <p className="text-sm text-brand-muted leading-7 max-w-2xl mt-5">
                  Professional experience and selected organizational
                  involvement.
                </p>

              </div>

            </div>

          </section>


          {/* WORK EXPERIENCE */}

          <section className="border-t border-brand-line py-16">

            <div className="grid lg:grid-cols-[0.3fr_1fr] gap-8">

              <span className="text-xs uppercase tracking-[0.25em] text-brand-muted">
                Work
              </span>


              <div>

                {PORTFOLIO_DATA.workExperience.map(
                  (exp, index) => (

                    <article
                      key={exp.id}
                      className="border-t border-brand-line first:border-t-0 py-7 first:pt-0"
                    >

                      <div className="grid md:grid-cols-[1fr_auto] gap-4">

                        <div>

                          <p className="text-[10px] uppercase tracking-[0.2em] text-brand-pinkDark mb-2">
                            0{index + 1}
                          </p>

                          <h2 className="font-serif text-3xl">
                            {exp.role}
                          </h2>

                          <p className="text-sm text-brand-sageDark mt-0.5">
                            {exp.company}
                          </p>

                        </div>


                        <div className="md:text-right text-xs text-brand-muted">
                          {exp.period}
                          <br />
                          {exp.location}
                        </div>

                      </div>


                      <p className="mt-4 max-w-2xl text-sm leading-6 text-brand-muted">
                        {exp.summary}
                      </p>


                      <div className="mt-5 max-w-3xl">

                        {exp.highlights.map(
                          (highlight, i) => (

                            <div
                              key={i}
                              className="flex gap-4 border-t border-brand-line py-3"
                            >

                              <span className="text-[10px] text-brand-pinkDark">
                                0{i + 1}
                              </span>

                              <p className="text-sm leading-6">
                                {highlight}
                              </p>

                            </div>

                          )
                        )}

                      </div>


                      {exp.photos && (

                        <div className="mt-7 grid sm:grid-cols-2 gap-4">

                          {exp.photos.map(
                            (photo, i) => (

                              <figure
                                key={i}
                                className="image-hover overflow-hidden"
                              >

                                <div className="aspect-[16/9] overflow-hidden">

                                  <img
                                    src={photo.url}
                                    alt={photo.caption}
                                    className="w-full h-full object-cover"
                                  />

                                </div>

                                <figcaption className="mt-2 text-[9px] uppercase tracking-widest text-brand-muted">
                                  {photo.caption}
                                </figcaption>

                              </figure>

                            )
                          )}

                        </div>

                      )}

                    </article>

                  )
                )}

              </div>

            </div>

          </section>


          {/* ORGANIZATIONAL EXPERIENCE */}

          <section className="border-t border-brand-line py-16">

            <div className="grid lg:grid-cols-[0.3fr_1fr] gap-8">

              <span className="text-xs uppercase tracking-[0.25em] text-brand-muted">
                Organization
              </span>


              <div>

                {PORTFOLIO_DATA.orgExperience.map(
                  (org, index) => (

                    <article
                      key={org.id}
                      className="border-t border-brand-line first:border-t-0 py-5 first:pt-0"
                    >

                      <div className="grid md:grid-cols-[1fr_auto] gap-3">

                        <div>

                          <p className="text-[10px] uppercase tracking-[0.2em] text-brand-pinkDark">
                            0{index + 1}
                          </p>

                          <h3 className="text-lg font-semibold mt-1">
                            {org.organization}
                          </h3>

                          <p className="text-sm text-brand-sageDark mt-0.5">
                            {org.role}
                          </p>

                          <p className="text-sm text-brand-muted leading-6 mt-1 max-w-2xl">
                            {org.description}
                          </p>

                        </div>


                        <span className="text-xs text-brand-muted">
                          {org.period}
                        </span>

                      </div>

                    </article>

                  )
                )}

              </div>

            </div>

          </section>

        </div>

      );


      /* =========================================================
         PROJECT PAGE
      ========================================================= */

      const ProjectPage = () => (

        <div className="reveal">

          <section className="pb-16">

            <div className="grid lg:grid-cols-[0.3fr_1fr] gap-8">

              <span className="text-xs uppercase tracking-[0.25em] text-brand-muted">
                02 / Selected Work
              </span>


              <div>

                <h1 className="font-serif text-5xl sm:text-7xl leading-[0.9]">
                  Projects
                </h1>

                <p className="text-sm text-brand-muted leading-7 max-w-2xl mt-5">
                  Selected work in data analysis, visualization,
                  business intelligence, and machine learning.
                </p>

              </div>

            </div>

          </section>


          <section className="border-t border-brand-line pt-10 pb-16">

            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-14">

              {PORTFOLIO_DATA.projects.map(
                (project, index) => (

                  <article
                    key={project.id}
                    className="group"
                  >

                    {/* IMAGE */}

                    <a
                      href={project.driveDocUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="block image-hover overflow-hidden aspect-[4/3] mb-5"
                    >

                      <img
                        src={project.coverImage}
                        alt={project.title}
                        className="w-full h-full object-cover"
                      />

                    </a>


                    {/* CATEGORY */}

                    <div className="flex items-center justify-between">

                      <p className="text-[10px] uppercase tracking-[0.2em] text-brand-pinkDark">
                        {project.category}
                      </p>

                      <span className="text-[10px] text-brand-muted">
                        0{index + 1}
                      </span>

                    </div>


                    {/* TITLE */}

                    <h2 className="font-serif text-2xl leading-tight mt-1.5 group-hover:text-brand-pinkDark transition">
                      {project.title}
                    </h2>


                    {/* DESCRIPTION */}

                    <p className="text-sm leading-6 text-brand-muted mt-2">
                      {project.shortDesc}
                    </p>


                    {/* TECH */}

                    <div className="flex flex-wrap gap-x-3 gap-y-1 mt-3">

                      {project.tools.map(
                        (tool) => (

                          <span
                            key={tool}
                            className="text-[9px] uppercase tracking-widest text-brand-muted"
                          >
                            {tool}
                          </span>

                        )
                      )}

                    </div>


                    {/* DETAIL → DRIVE */}

                    <a
                      href={project.driveDocUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-2 mt-5 text-[10px] uppercase tracking-[0.18em] border-b border-brand-text pb-1 hover:text-brand-pinkDark hover:border-brand-pinkDark transition"
                    >

                      Details

                      <i
                        data-lucide="arrow-up-right"
                        className="w-3.5 h-3.5"
                      ></i>

                    </a>

                  </article>

                )
              )}

            </div>

          </section>

        </div>

      );


      /* =========================================================
         ROUTER
      ========================================================= */

      let pageContent = null;


      if (currentRoute === "/home") {

        pageContent = <HomePage />;

      } else if (currentRoute === "/exp") {

        pageContent = <ExperiencePage />;

      } else if (currentRoute === "/project") {

        pageContent = <ProjectPage />;

      } else {

        pageContent = <HomePage />;

      }


      return (

        <div className="min-h-screen bg-brand-bg text-brand-text">

          <Navbar />


          <main className="max-w-8xl mx-auto px-6 sm:px-10 lg:px-16 pt-12 md:pt-16">

            {pageContent}

          </main>


          <Footer />

        </div>

      );

    }


    /* =========================================================
       RENDER
    ========================================================= */

    ReactDOM
      .createRoot(
        document.getElementById("root")
      )
      .render(<App />);

  </script>

</body>
</html>
