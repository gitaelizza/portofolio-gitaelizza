                                                }`}>
                                                    {isExpanded ? 'Close Detail ▲' : 'Expand Detail ▼'}
                                                </span>
                                            </div>
                                        </div>

                                        {/* Accordion Content (Expands Downwards) */}
                                        {isExpanded && (
                                            <div className="px-6 pb-8 sm:px-8 border-t border-warm-gray/60 bg-slate-50/30 space-y-6 pt-6 animate-fadeIn">
                                                <div>
                                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">Detailed Role Overview</h4>
                                                    <p className="text-sm text-slate-700 leading-relaxed">{exp.description}</p>
                                                </div>

                                                <div>
                                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">Key Accomplishments</h4>
                                                    <ul className="list-disc list-inside text-sm text-slate-700 space-y-1">
                                                        {exp.achievements.map((ach, idx) => (
                                                            <li key={idx}>{ach}</li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                <div>
                                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">Tools & Technologies</h4>
                                                    <div className="flex flex-wrap gap-2">
                                                        {exp.tools.map((t, idx) => (
                                                            <span key={idx} className="text-xs bg-cream text-slate-700 px-3 py-1 rounded-md border border-warm-gray font-medium">
                                                                {t}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Photo Documentation Grid */}
                                                <div>
                                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-3">Activity & Event Documentation</h4>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                        {exp.photos.map((photo, pIdx) => (
                                                            <div key={pIdx} className="space-y-2">
                                                                <div className="h-48 rounded-xl overflow-hidden border border-warm-gray bg-slate-100">
                                                                    <img src={photo.url} alt={photo.caption} className="w-full h-full object-cover hover:scale-105 transition duration-300" />
                                                                </div>
                                                                <p className="text-[11px] text-slate-500 italic">{photo.caption}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Section 2: Organizational Experience */}
                    <div className="space-y-6 pt-6">
                        <div className="flex items-center space-x-3">
                            <span className="w-2.5 h-2.5 rounded-full bg-soft-sage-accent"></span>
                            <h2 className="font-serif-luxury text-2xl font-bold text-charcoal tracking-wide">Organizational Experience</h2>
                        </div>
                        <div className="space-y-4">
                            {ORG_EXPERIENCES.map((exp) => {
                                const isExpanded = !!expandedExp[exp.id];
                                return (
                                    <div key={exp.id} className="bg-cream-card rounded-2xl border border-warm-gray shadow-sm overflow-hidden transition-all duration-300">
                                        <div 
                                            onClick={() => toggleExp(exp.id)}
                                            className="p-6 sm:p-8 cursor-pointer hover:bg-slate-50/50 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4"
                                        >
                                            <div className="space-y-2 flex-1">
                                                <div className="flex items-center justify-between sm:justify-start sm:space-x-4">
                                                    <h3 className="font-bold text-lg text-charcoal">{exp.role}</h3>
                                                    <span className="text-xs bg-soft-sage text-charcoal px-3 py-1 rounded-full font-medium border border-soft-sage-dark/40">
                                                        {exp.period}
                                                    </span>
                                                </div>
                                                <p className="text-sm font-semibold text-soft-sage-accent">{exp.company}</p>
                                                <ul className="list-disc list-inside text-xs text-slate-600 space-y-1 pt-1">
                                                    {exp.bullets.map((b, idx) => (
                                                        <li key={idx}>{b}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                            <div className="flex items-center justify-end">
                                                <span className={`text-xs font-semibold px-4 py-2 rounded-full border transition-all ${
                                                    isExpanded 
                                                        ? 'bg-charcoal text-cream border-charcoal' 
                                                        : 'bg-warm-gray text-charcoal border-slate-300'
                                                }`}>
                                                    {isExpanded ? 'Close Detail ▲' : 'Expand Detail ▼'}
                                                </span>
                                            </div>
                                        </div>

                                        {isExpanded && (
                                            <div className="px-6 pb-8 sm:px-8 border-t border-warm-gray/60 bg-slate-50/30 space-y-6 pt-6 animate-fadeIn">
                                                <div>
                                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">Organization & Initiative Summary</h4>
                                                    <p className="text-sm text-slate-700 leading-relaxed">{exp.description}</p>
                                                </div>

                                                <div>
                                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">Key Outcomes</h4>
                                                    <ul className="list-disc list-inside text-sm text-slate-700 space-y-1">
                                                        {exp.achievements.map((ach, idx) => (
                                                            <li key={idx}>{ach}</li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                <div>
                                                    <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-3">Activity & Event Documentation</h4>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                        {exp.photos.map((photo, pIdx) => (
                                                            <div key={pIdx} className="space-y-2">
                                                                <div className="h-48 rounded-xl overflow-hidden border border-warm-gray bg-slate-100">
                                                                    <img src={photo.url} alt={photo.caption} className="w-full h-full object-cover hover:scale-105 transition duration-300" />
                                                                </div>
                                                                <p className="text-[11px] text-slate-500 italic">{photo.caption}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            const renderProjectPage = () => (
                <div className="max-w-5xl mx-auto px-6 py-12 space-y-8">
                    <div className="border-b border-warm-gray pb-4">
                        <h1 className="font-serif-luxury text-4xl sm:text-5xl font-normal text-charcoal">Projects</h1>
                        <p className="text-slate-500 text-sm mt-1">End-to-end data science & business intelligence project documentations.</p>
                    </div>

                    <div className="space-y-6">
                        {PROJECTS.map((p) => {
                            const isExpanded = !!expandedProj[p.id];
                            return (
                                <div key={p.id} className="bg-cream-card rounded-2xl border border-warm-gray shadow-sm overflow-hidden transition-all duration-300">
                                    <div className="p-6 sm:p-8 flex flex-col md:flex-row gap-6 items-start">
                                        <div className="w-full md:w-1/3 h-48 rounded-xl overflow-hidden border border-warm-gray flex-shrink-0">
                                            <img src={p.image} alt={p.title} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="flex-1 space-y-3">
                                            <span className="text-[10px] bg-soft-pink text-charcoal font-bold px-2.5 py-1 rounded-full uppercase tracking-wider border border-soft-pink-dark/40">
                                                {p.category}
                                            </span>
                                            <h2 className="font-bold text-xl text-charcoal">{p.title}</h2>
                                            <p className="text-sm text-slate-600 leading-relaxed">{p.shortDesc}</p>
                                            
                                            <div className="flex flex-wrap gap-2 pt-1">
                                                {p.tools.map((t, idx) => (
                                                    <span key={idx} className="text-[11px] bg-warm-gray text-slate-700 px-2.5 py-0.5 rounded font-medium">
                                                        {t}
                                                    </span>
                                                ))}
                                            </div>

                                            <div className="pt-2">
                                                <button
                                                    onClick={() => toggleProj(p.id)}
                                                    className="text-xs font-semibold uppercase tracking-wider px-5 py-2 rounded-full bg-soft-sage text-charcoal border border-soft-sage-dark hover:bg-soft-sage-dark/60 transition"
                                                >
                                                    {isExpanded ? 'Hide Documentation ▲' : 'View Full Documentation & UI Proof ▼'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Project Accordion Content */}
                                    {isExpanded && (
                                        <div className="px-6 pb-8 sm:px-8 border-t border-warm-gray/60 bg-slate-50/40 space-y-6 pt-6">
                                            <div>
                                                <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-2">Project Overview & Methodology</h4>
                                                <p className="text-sm text-slate-700 leading-relaxed">{p.overview}</p>
                                            </div>

                                            <div>
                                                <h4 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-3">Key Performance Metrics</h4>
                                                <div className="grid grid-cols-3 gap-3">
                                                    {p.metrics.map((m, idx) => (
                                                        <div key={idx} className="bg-cream p-3 rounded-xl border border-warm-gray text-center">
                                                            <p className="text-[10px] uppercase font-semibold text-slate-400">{m.label}</p>
                                                            <p className="text-base font-bold text-charcoal mt-0.5">{m.val}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="pt-2">
                                                <a
                                                    href={p.link}
                                                    target="_blank"
                                                    rel="noreferrer"
                                                    className="inline-block text-xs font-bold uppercase tracking-wider px-6 py-3 rounded-full bg-charcoal text-cream hover:bg-slate-800 transition"
                                                >
                                                    Open GitHub / Dashboard Repository &rarr;
                                                </a>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {renderHeader()}
                        {route === '#/home' && renderHome()}
                        {route === '#/exp' && renderExpPage()}
                        {route === '#/project' && renderProjectPage()}
                    </div>

                    <footer className="border-t border-warm-gray py-8 mt-16 text-center text-slate-500 text-xs">
                        <p>© 2026 {PROFILE.name}. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
